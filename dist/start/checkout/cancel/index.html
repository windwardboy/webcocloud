<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content"><title>Payment cancelled — Webco Cloud</title><meta name="description" content="Stripe Checkout was cancelled. The Webco order is not marked paid."><link rel="canonical" href="https://webcocloud.net/start/checkout/cancel/"><link rel="icon" href="/favicon.png" type="image/png"><link rel="preload" href="/_astro/inter-latin-wght-normal.Dx4kXJAl.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/_astro/fraunces-latin-wght-normal.ukD16Tqj.woff2" as="font" type="font/woff2" crossorigin><meta name="theme-color" content="#0c6b62"><meta name="robots" content="noindex"><meta property="og:title" content="Payment cancelled — Webco Cloud"><meta property="og:description" content="Stripe Checkout was cancelled. The Webco order is not marked paid."><meta property="og:url" content="https://webcocloud.net/start/checkout/cancel/"><meta property="og:type" content="website"><meta property="og:site_name" content="Webco Cloud"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Webco Cloud","url":"https://webcocloud.net"}</script><link rel="stylesheet" href="/_astro/global.BLwDzSJY.css"></head><body class="funnel funnel-track-wide"><a class="skip" href="#content">Skip to content</a><header class="funnel-header"><div class="funnel-header-bar"><a class="logo logo-compact" href="/"><img src="/images/logo-webco-cloud.png" width="1024" height="426" alt="Webco Cloud" decoding="async"></a><p class="funnel-phase">Payment</p></div></header><main id="content"><section class="funnel-shell"><h1>Payment was not completed</h1><p class="funnel-lead">Stripe returned you here before the payment was finished. This order is not marked paid.</p><article class="card"><h2>Order reference</h2><p id="order-reference" class="checkout-note">No order reference was included on this return.</p></article><div class="funnel-dock actions"><a class="button button-quiet" href="/support/">Support</a><a class="button" href="/start/checkout/">Return to checkout</a></div></section></main><script>
      const fieldSelector =
        "input:not([type=radio]):not([type=checkbox]):not([type=hidden]):not([type=button]):not([type=submit]), textarea, select";

      function isField(node) {
        return node instanceof HTMLElement && node.matches(fieldSelector);
      }

      function coveredBottom(field) {
        let bottom = field.getBoundingClientRect().bottom;
        const group = field.closest(".domain-field, fieldset");
        if (group) {
          const error = group.querySelector(".field-error");
          if (error && error.textContent.trim()) bottom = Math.max(bottom, error.getBoundingClientRect().bottom);
        }
        const form = field.closest("form");
        const result = form && form.nextElementSibling;
        if (result && result.classList.contains("domain-result") && result.textContent.trim() && !result.hidden) {
          bottom = Math.max(bottom, result.getBoundingClientRect().bottom);
        }
        return bottom;
      }

      function reveal(field) {
        const viewport = window.visualViewport;
        const topLimit = (viewport ? viewport.offsetTop : 0) + 76;
        const bottomLimit = (viewport ? viewport.offsetTop + viewport.height : window.innerHeight) - 12;
        const top = field.getBoundingClientRect().top;
        const bottom = coveredBottom(field);
        if (bottom > bottomLimit) window.scrollBy(0, bottom - bottomLimit + 10);
        else if (top < topLimit) window.scrollBy(0, top - topLimit);
      }

      const narrow = window.matchMedia("(max-width: 47.99rem)");

      function keyboardOpen() {
        const viewport = window.visualViewport;
        if (!viewport) return isField(document.activeElement);
        return window.innerHeight - viewport.height - viewport.offsetTop > 80;
      }

      function syncTyping() {
        const typing = narrow.matches && isField(document.activeElement) && keyboardOpen();
        document.body.classList.toggle("funnel-keyboard", typing);
        document.querySelectorAll(".funnel-dock").forEach((dock) => {
          dock.toggleAttribute("inert", typing);
        });
      }

      let keyboardTimer = 0;
      document.addEventListener("focusin", (event) => {
        if (!isField(event.target)) return;
        window.clearTimeout(keyboardTimer);
        keyboardTimer = window.setTimeout(() => {
          syncTyping();
          if (document.body.classList.contains("funnel-keyboard")) reveal(event.target);
        }, 50);
      });
      document.addEventListener("focusout", (event) => {
        if (!isField(event.target)) return;
        window.clearTimeout(keyboardTimer);
        keyboardTimer = window.setTimeout(syncTyping, 80);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", () => {
          const active = document.activeElement;
          syncTyping();
          if (document.body.classList.contains("funnel-keyboard") && isField(active)) reveal(active);
        });
      }
    </script></body></html><script>
  const result = document.getElementById("order-reference");
  const orderId = new URLSearchParams(window.location.search).get("order") || "";
  if (/^wc_[a-f0-9]{20}$/.test(orderId)) {
    result.textContent = "Order reference " + orderId + ".";
  }
</script>
