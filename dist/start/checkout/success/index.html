<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content"><title>Your order — Webco Cloud</title><meta name="description" content="Payment status for a Webco Cloud website order."><link rel="canonical" href="https://webcocloud.net/start/checkout/success/"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#0c6b62"><meta name="robots" content="noindex"><meta property="og:title" content="Your order — Webco Cloud"><meta property="og:description" content="Payment status for a Webco Cloud website order."><meta property="og:url" content="https://webcocloud.net/start/checkout/success/"><meta property="og:type" content="website"><meta property="og:site_name" content="Webco Cloud"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Webco Cloud","url":"https://webcocloud.net"}</script><link rel="stylesheet" href="/_astro/global.BW2Ki8iZ.css"></head><body class="funnel funnel-track-wide"><a class="skip" href="#content">Skip to content</a><header class="funnel-header"><div class="funnel-header-bar"><a class="logo" href="/"><img src="/favicon.svg" width="28" height="28" alt=""><span class="logo-word"><span class="logo-webco">Webco</span> <span class="logo-cloud">Cloud</span></span></a><p class="funnel-phase">Payment</p></div></header><main id="content"><section class="funnel-shell"><h1 id="payment-heading">Checking your payment</h1><p id="payment-lead" class="funnel-lead">Checking this order.</p><article class="card"><p id="payment-message" class="checkout-note" role="status">Checking this order.</p><dl class="summary" id="payment-summary" hidden></dl><p id="payment-next" class="start-note" hidden></p></article><div class="funnel-dock actions"><a class="button button-quiet" href="/support/">Support</a><button class="button" type="button" id="payment-refresh" hidden>Check again</button></div></section></main><script>
      const fieldSelector =
        "input:not([type=radio]):not([type=checkbox]):not([type=hidden]):not([type=button]):not([type=submit]), textarea, select";

      function isField(node) {
        return node instanceof HTMLElement && node.matches(fieldSelector);
      }

      function coveredBottom(field) {
        let bottom = field.getBoundingClientRect().bottom;
        const group = field.closest(".domain-field, fieldset");
        if (group) {
          const error = group.querySelector(".field-error");
          if (error && error.textContent.trim()) bottom = Math.max(bottom, error.getBoundingClientRect().bottom);
        }
        const form = field.closest("form");
        const result = form && form.nextElementSibling;
        if (result && result.classList.contains("domain-result") && result.textContent.trim() && !result.hidden) {
          bottom = Math.max(bottom, result.getBoundingClientRect().bottom);
        }
        return bottom;
      }

      function reveal(field) {
        const viewport = window.visualViewport;
        const topLimit = (viewport ? viewport.offsetTop : 0) + 76;
        const bottomLimit = (viewport ? viewport.offsetTop + viewport.height : window.innerHeight) - 12;
        const top = field.getBoundingClientRect().top;
        const bottom = coveredBottom(field);
        if (bottom > bottomLimit) window.scrollBy(0, bottom - bottomLimit + 10);
        else if (top < topLimit) window.scrollBy(0, top - topLimit);
      }

      const narrow = window.matchMedia("(max-width: 47.99rem)");

      function keyboardOpen() {
        const viewport = window.visualViewport;
        if (!viewport) return isField(document.activeElement);
        return window.innerHeight - viewport.height - viewport.offsetTop > 80;
      }

      function syncTyping() {
        const typing = narrow.matches && isField(document.activeElement) && keyboardOpen();
        document.body.classList.toggle("funnel-keyboard", typing);
        document.querySelectorAll(".funnel-dock").forEach((dock) => {
          dock.toggleAttribute("inert", typing);
        });
      }

      let keyboardTimer = 0;
      document.addEventListener("focusin", (event) => {
        if (!isField(event.target)) return;
        window.clearTimeout(keyboardTimer);
        keyboardTimer = window.setTimeout(() => {
          syncTyping();
          if (document.body.classList.contains("funnel-keyboard")) reveal(event.target);
        }, 50);
      });
      document.addEventListener("focusout", (event) => {
        if (!isField(event.target)) return;
        window.clearTimeout(keyboardTimer);
        keyboardTimer = window.setTimeout(syncTyping, 80);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", () => {
          const active = document.activeElement;
          syncTyping();
          if (document.body.classList.contains("funnel-keyboard") && isField(active)) reveal(active);
        });
      }
    </script></body></html><script>
  const lead = document.getElementById("payment-lead");
  const heading = document.getElementById("payment-heading");
  const message = document.getElementById("payment-message");
  const summary = document.getElementById("payment-summary");
  const next = document.getElementById("payment-next");
  const refresh = document.getElementById("payment-refresh");
  const requestedId = new URLSearchParams(window.location.search).get("order") || "";

  function row(label, value) {
    const item = document.createElement("div");
    const term = document.createElement("dt");
    const detail = document.createElement("dd");
    term.textContent = label;
    detail.textContent = value;
    item.append(term, detail);
    return item;
  }

  function showUnknown() {
    lead.textContent = "Contact support if you need help with this return.";
    heading.textContent = "We could not confirm this order";
    message.textContent = "We could not find an order for this return. If you have just paid, contact support and keep any receipt from Stripe.";
    summary.hidden = true;
    summary.replaceChildren();
    next.hidden = true;
    next.textContent = "";
    refresh.hidden = true;
  }

  function showDraft(orderId) {
    lead.textContent = "Payment is being confirmed.";
    heading.textContent = "Payment is being confirmed";
    message.textContent = "Payment is being confirmed. Check again in a moment. You do not need to pay again while this is in progress.";
    summary.hidden = false;
    summary.replaceChildren(row("Order reference", orderId));
    next.hidden = true;
    next.textContent = "";
    refresh.hidden = false;
  }

  function showPaid(data) {
    const rows = [row("Order reference", data.orderId)];
    if (data.packageName === "Webco Essential" || data.packageName === "Webco Professional") {
      rows.push(row("Website package", data.packageName));
    }
    if (/^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/.test(data.domain || "")) {
      rows.push(row("Domain", data.domain));
    }
    if (data.care === "managed") {
      rows.push(row("Hosting", "Managed Care"));
    } else if (data.care === "standard") {
      rows.push(row("Hosting", "Annual hosting"));
    }
    lead.textContent = "Payment received.";
    heading.textContent = "Payment received";
    message.textContent = "Payment has been received for this order.";
    summary.hidden = false;
    summary.replaceChildren(...rows);
    next.hidden = false;
    next.textContent = "Webco will email you a secure website-brief link. You can complete it and upload material in your own time. You do not need to pay again.";
    refresh.hidden = true;
  }

  function applyStatus(data) {
    if (!data || typeof data !== "object") {
      showUnknown();
      return;
    }
    if (data.status === "draft" && data.orderId === requestedId) {
      showDraft(data.orderId);
      return;
    }
    if (data.status === "paid" && data.orderId === requestedId) {
      showPaid(data);
      return;
    }
    showUnknown();
  }

  async function checkOrder() {
    lead.textContent = "Checking this order.";
    heading.textContent = "Checking your payment";
    message.textContent = "Checking this order.";
    summary.hidden = true;
    summary.replaceChildren();
    next.hidden = true;
    next.textContent = "";
    refresh.disabled = true;
    if (!/^wc_[a-f0-9]{20}$/.test(requestedId)) {
      showUnknown();
      refresh.disabled = false;
      return;
    }
    try {
      const response = await fetch("/order-status.php?order=" + encodeURIComponent(requestedId), {
        headers: { Accept: "application/json" },
      });
      const data = await response.json();
      if (!response.ok) {
        showUnknown();
        return;
      }
      applyStatus(data);
    } catch {
      showUnknown();
    } finally {
      refresh.disabled = false;
    }
  }

  refresh.addEventListener("click", () => {
    checkOrder();
  });
  checkOrder();
</script>
